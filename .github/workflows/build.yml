name: build

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Display tag
        run: echo ${{ inputs.tag || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Build and Push capuchin image
        run: |
          VERSION=${{ inputs.tag || github.ref_name }}
          make PUSH=true APP_VERSION=${VERSION#v} build-docker-capuchin

      - name: Determine changelog range
        id: range
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::Tag is empty" >&2
            exit 1
          fi
          prev=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --merged "$TAG" --sort=-version:refname | head -n2 | tail -n1)
          if [ -n "$prev" ] && [ "$prev" != "$TAG" ]; then
            echo "mode=tags" >> "$GITHUB_OUTPUT"
            echo "from=$TAG" >> "$GITHUB_OUTPUT"
            echo "to=$prev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          root=$(git rev-list --max-parents=0 HEAD | head -n1)
          self=$(git rev-parse "$TAG^{commit}")
          if [ "$root" != "$self" ]; then
            echo "mode=root" >> "$GITHUB_OUTPUT"
            echo "from=$TAG" >> "$GITHUB_OUTPUT"
            echo "to=$root" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Changelog
        id: changelog
        if: steps.range.outputs.mode == 'tags'
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.range.outputs.from }}
          writeToFile: false
          excludeTypes: ""
          includeInvalidCommits: true

      - name: Generate Changelog (first release)
        id: changelog-first
        if: steps.range.outputs.mode == 'root'
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fromTag: ${{ steps.range.outputs.from }}
          toTag: ${{ steps.range.outputs.to }}
          writeToFile: false
          excludeTypes: ""
          includeInvalidCommits: true

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          name: Release ${{ inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.changes || steps.changelog-first.outputs.changes || format('Initial release {0}', inputs.tag || github.ref_name) }}
          token: ${{ secrets.GITHUB_TOKEN }}
