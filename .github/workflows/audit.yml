name: audit

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  audit-back:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner for code
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./back
          trivy-config: trivy.yaml
        continue-on-error: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: ./back/go.sum

      - name: Run mocks check
        run: |
          make mocks
          git diff --exit-code || {
            echo "❌ Mock files are not up to date!"
            echo "Please run 'make mocks' locally and commit the changes."
            echo "Differences found:"
            git diff --name-only
            exit 1
          }
        working-directory: ./back

      - name: Run linter check
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: ./back

      - name: Run vulnerability check
        run: |
          make tools-govulncheck
          export PATH="$(pwd)/bin:${PATH}"
          govulncheck -show verbose ./...
        working-directory: ./back
        continue-on-error: true

      - name: Run test
        run: go test -race -failfast -count 1 ./...
        working-directory: ./back

      - name: Run integration test
        env:
          SQLITE_DB_PATH: "data/capuchin.db"
          GOOSE_DRIVER: "sqlite3"
          GOOSE_DBSTRING: "data/capuchin.db"
          GOOSE_MIGRATION_DIR: "./migrations"
        run: |
          make integration-sqlite
        working-directory: ./back

      - name: Build capuchin image
        run: docker build --rm -t ghcr.io/capuchinapp/capuchin:${{github.ref_name}} --build-arg APP_VERSION=${{github.ref_name}} -f build/Dockerfile .

      - name: Run Trivy vulnerability scanner for image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/capuchinapp/capuchin:${{github.ref_name}}
          trivy-config: trivy.yaml
        continue-on-error: true

  audit-front:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner for code
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./front
          trivy-config: trivy.yaml
        continue-on-error: true

      - name: Run OWASP/cve-lite-cli for code
        uses: OWASP/cve-lite-cli@v1
        continue-on-error: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --ignore-scripts
        working-directory: ./front

      - name: Run audit
        run: bun audit
        working-directory: ./front
        continue-on-error: true

      - name: Run lint
        run: bun run lint
        working-directory: ./front

      - name: Run test
        run: bun run test
        working-directory: ./front

      - name: Run check
        run: bun run check
        working-directory: ./front

      - name: Run build
        run: bun run build
        working-directory: ./front
