<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    </head>
    <body style="margin: 0; padding: 0; background-color: #f2f2f2; font-size: 16px">
        <table width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#F2F2F2">
            <tr>
                <td height="20" style="font-size: 20px; line-height: 20px">&nbsp;</td>
            </tr>
            <tr>
                <td align="center" valign="top">
                    <table width="640" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF">
                        <tr>
                            <td height="20" style="font-size: 20px; line-height: 20px">&nbsp;</td>
                        </tr>
                        <tr>
                            <td>
                                <table width="600" cellpadding="0" cellspacing="0" border="0" align="center">
                                    <tr>
                                        <td align="right" valign="middle" width="42%">
                                            <img
                                                src="cid:logo.png"
                                                width="100"
                                                height="100"
                                                style="margin: 0; padding: 0; border: none; display: block"
                                                border="0"
                                                alt="Capuchin"
                                            />
                                        </td>
                                        <td width="2%">&nbsp;</td>
                                        <td align="left" valign="middle" width="55%">
                                            <code style="font-size: 40px; font-weight: bold">Capuchin</code>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td height="20" style="font-size: 20px; line-height: 20px; border-top: #ff6421 solid 1px">
                                &nbsp;
                            </td>
                        </tr>
                        <tr>
                            <td>{{block "content" .}} {{end}}</td>
                        </tr>
                        <tr>
                            <td
                                height="20"
                                style="font-size: 20px; line-height: 20px; border-bottom: #ced4da solid 1px"
                            >
                                &nbsp;
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <table
                                    width="600"
                                    cellpadding="0"
                                    cellspacing="0"
                                    border="0"
                                    align="center"
                                    style="text-align: center"
                                >
                                    <tr>
                                        <td height="20" style="font-size: 20px; line-height: 20px">&nbsp;</td>
                                    </tr>
                                    <tr>
                                        <td>С уважением, команда Capuchin</td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td height="20" style="font-size: 20px; line-height: 20px">&nbsp;</td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td height="20" style="font-size: 20px; line-height: 20px">&nbsp;</td>
            </tr>
        </table>
    </body>
</html>
